# ============================================================
# 区域：pytest 配置
# 作用：告诉 pytest 去哪里找测试、怎么处理 async 测试函数
# 用法：在项目根目录执行  python -m pytest tests -v
# ============================================================

[pytest]
testpaths = tests
# 只在 tests 目录下收集测试，避免把 .venv 里的第三方测试也扫进来

asyncio_mode = auto
# async def 测试函数自动识别，不用每个都加 @pytest.mark.asyncio 装饰器
#   （pytest-asyncio 1.x 必须显式配置，否则 async 测试会被直接跳过并给警告）

python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 测试文件的命名约定

filterwarnings =
    ignore::DeprecationWarning
# 忽略第三方库的过期告警，让测试输出干净（只看我们自己代码的问题）
